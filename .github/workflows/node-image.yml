# Собрать образ узла и выложить в GHCR.
#
# Почему не локально: база разворачивается в 20+ ГБ, и на машине автора
# сборка дважды уронила движок Docker, забив диск. Здесь диск чужой.
#
# Сборка не единственная работа этого обхода. У образа есть признаки,
# которые проверяются БЕЗ карты, и проверяются они здесь же, до выкладки:
# содержимое и четыре отказа. Образ, который собрался, но молча запускает
# узел с чужим кешем ядер, нам не нужен.
name: образ узла

on:
  workflow_dispatch:
  push:
    tags:
      - 'node-image-v*'

permissions:
  contents: read
  packages: write

env:
  # Имя из ДВУХ сегментов, и это не стиль, а проверенное требование:
  # проба 29 октября показала, что GHCR в пространстве имён пользователя
  # отвергает владелец/репозиторий/имя на манифесте (слои уходят, а
  # манифест получает denied), и принимает владелец/имя.
  IMAGE: ghcr.io/${{ github.repository_owner }}/verifiable-inference-node
  # Официальный выпуск Axiome v2.2.1. Сумма сверяется внутри сборки;
  # без неё Dockerfile отказывается собираться.
  AXMD_SHA256: c8ef347f91b1378225f102c1124efcdc81fe6bb83ae2223fd8175df2041c0d4d

jobs:
  obraz:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: место до уборки
        run: df -h / | tail -1

      - name: освободить диск
        # Раннер приносит с собой .NET, Android SDK и GHC, которые нам не
        # нужны, — это десятки гигабайт. Без этого шага сборка падает на
        # распаковке базового слоя.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" \
                      /usr/local/share/powershell /usr/share/swift
          sudo docker image prune -af
          df -h / | tail -1

      - name: собрать
        run: |
          docker build \
            -f protocol/node-image/Dockerfile \
            -t "$IMAGE:${{ github.sha }}" \
            --build-arg AXMD_SHA256="$AXMD_SHA256" \
            protocol/
          echo "собрано, размер:"
          docker images "$IMAGE" --format '{{.Repository}}:{{.Tag}} {{.Size}}'

      - name: что внутри
        # Положительные признаки. Пустой вывод успехом не считается.
        run: |
          set -eu
          out=$(docker run --rm --entrypoint sh "$IMAGE:${{ github.sha }}" -c '
            axmd version
            ls /opt/node/cache/*.tar.gz | wc -l
            python3 -c "import sys; sys.path.insert(0,\"/opt/node/daemon\"); import loop, client, chain, conformance; print(\"демоны импортируются\")"
            test -x /opt/node/start.sh && echo "start.sh исполняемый"
            ls /opt/node/daemon/test_*.py 2>/dev/null | wc -l
          ')
          echo "$out"
          case "$out" in
            *v2.2.1*) echo "ок: axmd запускается, значит libwasmvm на месте" ;;
            *) echo "ОТКАЗ: axmd не запустился"; exit 1 ;;
          esac
          case "$out" in
            *"демоны импортируются"*) echo "ок: демоны импортируются" ;;
            *) echo "ОТКАЗ: демоны не импортируются"; exit 1 ;;
          esac
          printf '%s\n' "$out" | sed -n '2p' | grep -qx 3 \
            || { echo "ОТКАЗ: кешей ядер не три"; exit 1; }
          echo "ок: кеш всех трёх классов на месте"

      - name: отказы
        # Отказ с внятной причиной — такой же признак, как успех.
        run: |
          set -eu
          probe() {
            desc="$1"; want="$2"; shift 2
            out=$(docker run --rm "$@" "$IMAGE:${{ github.sha }}" 2>&1 || true)
            case "$out" in
              *"$want"*) echo "ок: $desc" ;;
              *) echo "ОТКАЗ: $desc — ожидалось «$want», получено:"; echo "$out" | tail -3; exit 1 ;;
            esac
          }
          probe "без CONTRACT не стартует"       "нужен CONTRACT"
          probe "без ENDPOINT не стартует"       "нужен ENDPOINT" -e CONTRACT=axm1xxx
          probe "адрес без схемы отвергнут"      "http://"        -e CONTRACT=axm1xxx -e ENDPOINT=1.2.3.4:8081
          probe "без карты не притворяется"      "nvidia-smi"     -e CONTRACT=axm1xxx -e ENDPOINT=http://1.2.3.4:8081

      - name: выложить
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:v1"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:v1"
          echo "digest, который можно назвать в инструкции:"
          docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:v1" || true
